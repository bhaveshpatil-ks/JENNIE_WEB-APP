name: Build & CI Verification

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/ACTIVITY.md'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'ci-verification'
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
